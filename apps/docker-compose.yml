# Local infrastructure of the AED prototype. Fixed project name and ports that do not collide with
# Car Reminder (postgres 5432): containers and volumes stay the same when the repo folder is moved.
name: aed

services:
  postgres:
    # PostgreSQL 16 with PostGIS (geography points and "nearest AED" queries).
    image: postgis/postgis:16-3.4
    container_name: aed-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aed
    ports:
      - "5433:5432"
    volumes:
      - aed-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aed-postgres-data:
