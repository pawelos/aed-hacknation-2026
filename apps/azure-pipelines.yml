# AED prototype: build of the VPS images only (CI check). The deployment builds them itself:
# deploy/azure-pipelines.yml runs the same script, then loads the images on the VPS.
#   apps/tools/build-release.ps1 -> artifact "release" (images.tar.gz + version.txt)
# Pattern: C:\car-reminder\apps\azure-pipelines.yml.
#
# Optional one-time setup: pipeline from the YAML file /apps/azure-pipelines.yml, named "apps".

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Build
    timeoutInMinutes: 40
    steps:
      - checkout: self
        fetchDepth: 1

      - pwsh: ./apps/tools/build-release.ps1
        displayName: Build release images

      - bash: |
          set -euo pipefail
          version="$(ls apps/release)"
          echo "Release $version"
          echo "##vso[build.updatebuildnumber]$version"
          echo "##vso[task.setvariable variable=version]$version"
        displayName: Read release version

      - publish: apps/release/$(version)
        artifact: release
        displayName: Publish release artifact
