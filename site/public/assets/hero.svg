<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none">
  <!-- Hero illustration (flat style like the Car Reminder sign-in panel): phone with an AED map,
       AED cabinet, data records with checks, 24/7 badge, decorative dots. Decorative: the page gives alt="". -->

  <!-- background -->
  <circle cx="290" cy="215" r="172" fill="#e8f7ee"/>
  <ellipse cx="290" cy="215" rx="236" ry="120" stroke="#0b1f3a" stroke-opacity=".35" stroke-width="1.5" transform="rotate(-14 290 215)"/>

  <!-- data card (left top) -->
  <g>
    <rect x="34" y="96" width="166" height="104" rx="14" fill="#ffffff" stroke="#d6dfeb" stroke-width="2"/>
    <rect x="50" y="112" width="60" height="8" rx="4" fill="#3f83f8"/>
    <circle cx="58" cy="140" r="8" fill="#00b04a"/>
    <path d="m54 140 3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="74" y="136" width="108" height="7" rx="3.5" fill="#9fb3cc"/>
    <circle cx="58" cy="164" r="8" fill="#00b04a"/>
    <path d="m54 164 3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="74" y="160" width="88" height="7" rx="3.5" fill="#9fb3cc"/>
    <circle cx="58" cy="186" r="8" fill="#facc15"/>
    <path d="M58 182v5" stroke="#0b1f3a" stroke-width="2" stroke-linecap="round"/>
    <rect x="74" y="182" width="64" height="7" rx="3.5" fill="#9fb3cc"/>
    <circle cx="190" cy="104" r="6" fill="#f05252"/>
  </g>

  <!-- CSV / GeoJSON file (left bottom) -->
  <g>
    <path d="M60 262h62l20 20v74a10 10 0 0 1-10 10H60a10 10 0 0 1-10-10v-84a10 10 0 0 1 10-10Z" fill="#ffffff" stroke="#d6dfeb" stroke-width="2"/>
    <path d="M122 262v20h20" stroke="#d6dfeb" stroke-width="2" stroke-linejoin="round"/>
    <rect x="62" y="296" width="54" height="18" rx="5" fill="#00b04a"/>
    <text x="89" y="309" fill="#ffffff" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CSV</text>
    <rect x="62" y="324" width="66" height="6" rx="3" fill="#9fb3cc"/>
    <rect x="62" y="338" width="46" height="6" rx="3" fill="#9fb3cc"/>
  </g>

  <!-- phone with map -->
  <g>
    <rect x="206" y="58" width="172" height="306" rx="26" fill="#0b1f3a"/>
    <rect x="216" y="76" width="152" height="270" rx="16" fill="#f4f8f5"/>
    <rect x="270" y="64" width="44" height="6" rx="3" fill="#24395a"/>
    <!-- map blocks -->
    <rect x="226" y="88" width="56" height="48" rx="6" fill="#d9f2e3"/>
    <rect x="292" y="88" width="66" height="30" rx="6" fill="#e5ecf5"/>
    <rect x="292" y="126" width="66" height="54" rx="6" fill="#d9f2e3"/>
    <rect x="226" y="146" width="56" height="70" rx="6" fill="#e5ecf5"/>
    <rect x="226" y="226" width="56" height="44" rx="6" fill="#d9f2e3"/>
    <rect x="292" y="190" width="66" height="80" rx="6" fill="#e5ecf5"/>
    <!-- route -->
    <path d="M240 300c18-24 30-40 52-58s38-36 44-70" stroke="#00b04a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
    <!-- you are here -->
    <circle cx="240" cy="302" r="12" fill="#3f83f8" fill-opacity=".25"/>
    <circle cx="240" cy="302" r="6" fill="#3f83f8" stroke="#fff" stroke-width="2"/>
    <!-- small pins -->
    <path d="M262 118a7 7 0 0 1 14 0c0 6-7 12-7 12s-7-6-7-12Z" fill="#9fb3cc"/>
    <path d="M330 232a7 7 0 0 1 14 0c0 6-7 12-7 12s-7-6-7-12Z" fill="#9fb3cc"/>
    <!-- AED pin -->
    <path d="M318 150a20 20 0 0 1 40 0c0 16-20 32-20 32s-20-16-20-32Z" fill="#c8102e"/>
    <path d="M338 160s-10-6-10-12a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 6-10 12-10 12Z" fill="#ffffff"/>
    <!-- bottom sheet -->
    <rect x="226" y="282" width="132" height="54" rx="12" fill="#ffffff" stroke="#d6dfeb"/>
    <rect x="270" y="294" width="74" height="7" rx="3.5" fill="#0b1f3a"/>
    <rect x="270" y="308" width="54" height="6" rx="3" fill="#9fb3cc"/>
    <rect x="236" y="292" width="26" height="26" rx="7" fill="#00b04a"/>
    <path d="M249 312s-7-4-7-9a3.6 3.6 0 0 1 7-1.4 3.6 3.6 0 0 1 7 1.4c0 5-7 9-7 9Z" fill="#ffffff"/>
    <rect x="270" y="320" width="40" height="8" rx="4" fill="#00b04a"/>
  </g>

  <!-- AED cabinet (right) -->
  <g>
    <rect x="404" y="176" width="118" height="132" rx="18" fill="#00b04a"/>
    <rect x="416" y="188" width="94" height="84" rx="12" fill="#00963f"/>
    <path d="M463 260s-30-17-30-36a15 15 0 0 1 30-5 15 15 0 0 1 30 5c0 19-30 36-30 36Z" fill="#ffffff"/>
    <path d="m468 210-12 18h9l-4 16 14-21h-9l2-13Z" fill="#c8102e"/>
    <text x="463" y="296" fill="#ffffff" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="2">AED</text>
  </g>

  <!-- 24/7 badge -->
  <g>
    <circle cx="466" cy="112" r="34" fill="#ffffff" stroke="#d6dfeb" stroke-width="2"/>
    <circle cx="466" cy="112" r="25" stroke="#00b04a" stroke-width="3"/>
    <text x="466" y="118" fill="#0b1f3a" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">24/7</text>
  </g>

  <!-- verified badge -->
  <g>
    <rect x="392" y="330" width="138" height="40" rx="20" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/>
    <circle cx="414" cy="350" r="10" fill="#00b04a"/>
    <path d="m409 350 4 4 6-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="432" y="346" width="80" height="8" rx="4" fill="#3f83f8"/>
  </g>

  <!-- decorative dots and pluses -->
  <circle cx="186" cy="40" r="4" fill="#3f83f8"/>
  <circle cx="396" cy="56" r="5" fill="#f05252"/>
  <circle cx="540" cy="250" r="3" fill="#0b1f3a"/>
  <circle cx="176" cy="300" r="4" fill="#f05252"/>
  <circle cx="380" cy="398" r="3" fill="#3f83f8"/>
  <circle cx="24" cy="236" r="3" fill="#facc15"/>
  <path d="M520 52v14M513 59h14" stroke="#00b04a" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 60v10M25 65h10" stroke="#f05252" stroke-width="2" stroke-linecap="round"/>
  <path d="M170 380v12M164 386h12" stroke="#3f83f8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
