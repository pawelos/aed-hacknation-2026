# HackNation 2026: deploy of the wizytówka (site/) and the AED prototype (apps/) to the OVH VPS.
# Manual runs only (Pipelines -> Run). Pattern: C:\car-reminder\deploy\azure-pipelines.yml.
#   Build:  apps/tools/build-release.ps1 -> images aed/api + aed/web (images.tar.gz)
#   Deploy: git archive site deploy + images -> SSH -> deploy.sh up / health, app load / up / health
# The VPS never builds and holds no source code; secrets live only in ~/hacknation-2026/aed.env on the VPS.
#
# One-time setup in Azure DevOps (deploy/WDROZENIE.md):
#   - pipeline from the YAML file /deploy/azure-pipelines.yml;
#   - SSH service connection "vps-hacknation" (host 152.228.135.251, user ubuntu), allowed for this pipeline;
#   - environment "hacknation" (no checks).

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  vpsDir: /home/ubuntu/hacknation-2026
  vpsInbox: /home/ubuntu/deploy-in

stages:
  - stage: Build
    displayName: Build images (aed/api, aed/web)
    jobs:
      - job: Images
        timeoutInMinutes: 40
        steps:
          - checkout: self
            fetchDepth: 1

          - pwsh: ./apps/tools/build-release.ps1
            displayName: Build release images

          - bash: |
              set -euo pipefail
              version="$(ls apps/release)"
              echo "Release $version"
              echo "##vso[build.updatebuildnumber]$version"
              echo "##vso[task.setvariable variable=version]$version"
            displayName: Read release version

          - publish: apps/release/$(version)
            artifact: release
            displayName: Publish release artifact

  - stage: Deploy
    displayName: Deploy (hacknation-2026.pl, aed.hacknation-2026.pl)
    dependsOn: Build
    jobs:
      - deployment: Vps
        environment: hacknation
        timeoutInMinutes: 30
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - download: current
                  artifact: release
                  displayName: Download release images

                - bash: git archive --format=tar.gz -o "$(Build.ArtifactStagingDirectory)/hacknation.tar.gz" HEAD site deploy
                  displayName: Pack site/ and deploy/ (git-tracked files, not apps/ or docs/)

                - task: CopyFilesOverSSH@0
                  displayName: Copy hacknation.tar.gz
                  inputs:
                    sshEndpoint: vps-hacknation
                    sourceFolder: $(Build.ArtifactStagingDirectory)
                    contents: hacknation.tar.gz
                    targetFolder: $(vpsInbox)
                    overwrite: true

                - task: CopyFilesOverSSH@0
                  displayName: Copy images.tar.gz
                  inputs:
                    sshEndpoint: vps-hacknation
                    sourceFolder: $(Pipeline.Workspace)/release
                    contents: images.tar.gz
                    targetFolder: $(vpsInbox)
                    overwrite: true

                - task: SSH@0
                  displayName: Unpack, start the site and the prototype
                  inputs:
                    sshEndpoint: vps-hacknation
                    runOptions: inline
                    # docker logs progress to stderr: sent to stdout, a failing command still fails the step.
                    failOnStdErr: false
                    inline: |
                      set -euo pipefail
                      exec 2>&1
                      mkdir -p $(vpsDir)
                      # Files removed from the repo disappear from the server too (aed.env lives outside these folders).
                      rm -rf $(vpsDir)/site $(vpsDir)/deploy
                      tar -xzf $(vpsInbox)/hacknation.tar.gz -C $(vpsDir)
                      cd $(vpsDir)
                      chmod +x deploy/scripts/*.sh
                      ./deploy/scripts/deploy.sh up
                      ./deploy/scripts/deploy.sh health
                      ./deploy/scripts/deploy.sh app load $(vpsInbox)/images.tar.gz
                      ./deploy/scripts/deploy.sh app up
                      ./deploy/scripts/deploy.sh app health
                      ./deploy/scripts/deploy.sh prune
                      rm -f $(vpsInbox)/images.tar.gz
